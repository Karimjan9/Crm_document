; Copy to /etc/supervisor/conf.d/ after changing the path and user.
; QUEUE_CONNECTION must be database (or another real queue backend), never sync in production.

[program:crm-document-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/crm-document/artisan queue:work database --queue=default --sleep=3 --tries=3 --timeout=120 --max-time=3600
directory=/var/www/crm-document
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/supervisor/crm-document-worker.log
stopwaitsecs=3600
